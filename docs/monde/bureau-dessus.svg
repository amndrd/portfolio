<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="ui-monospace, Menlo, Consolas, monospace">
  <title>Le bureau vu de dessus : la verrière, les objets, la caméra et les passages</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0b45a"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fcf8f"/></marker>
    <linearGradient id="fov" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f0b45a" stop-opacity="0.28"/><stop offset="1" stop-color="#f0b45a" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="900" height="640" fill="#0d0d0d"/>
  <text x="340" y="30" fill="#e8e4d8" font-size="15" font-weight="700" text-anchor="middle">LE BUREAU VU DE DESSUS</text>
  <text x="340" y="48" fill="#9a968c" font-size="11" text-anchor="middle">1 m = 80 px · la caméra regarde vers le haut de l'image</text>

  <!-- floor -->
  <rect x="60" y="60" width="560" height="480" fill="#161616"/>
  <!-- light pool around the desk -->
  <ellipse cx="340" cy="250" rx="150" ry="95" fill="#e8e4d8" opacity="0.07"/>

  <!-- glass walls with mullions: back, right, front -->
  <g stroke="#7fa8c8" stroke-width="2" fill="none">
    <line x1="60" y1="60" x2="620" y2="60"/><line x1="620" y1="60" x2="620" y2="540"/><line x1="60" y1="540" x2="620" y2="540"/>
  </g>
  <g stroke="#7fa8c8" stroke-width="5">
    <line x1="156" y1="58" x2="156" y2="62"/><line x1="252" y1="58" x2="252" y2="62"/><line x1="348" y1="58" x2="348" y2="62"/>
    <line x1="444" y1="58" x2="444" y2="62"/><line x1="540" y1="58" x2="540" y2="62"/>
    <line x1="618" y1="156" x2="622" y2="156"/><line x1="618" y1="252" x2="622" y2="252"/><line x1="618" y1="348" x2="622" y2="348"/><line x1="618" y1="444" x2="622" y2="444"/>
    <line x1="156" y1="538" x2="156" y2="542"/><line x1="252" y1="538" x2="252" y2="542"/><line x1="444" y1="538" x2="444" y2="542"/><line x1="540" y1="538" x2="540" y2="542"/>
  </g>
  <!-- solid wall on the left, with the stairwell door -->
  <rect x="52" y="60" width="8" height="324" fill="#e8e4d8"/>
  <rect x="52" y="456" width="8" height="84" fill="#e8e4d8"/>
  <path d="M60,384 A72,72 0 0 1 132,456" fill="none" stroke="#e8e4d8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="384" x2="132" y2="384" stroke="#e8e4d8" stroke-width="2"/>
  <!-- glass door to the roof, right wall -->
  <rect x="616" y="140" width="8" height="80" fill="#0d0d0d" stroke="#8fcf8f" stroke-width="2"/>

  <!-- pillars -->
  <rect x="244" y="132" width="32" height="32" fill="#9a968c"/><rect x="404" y="132" width="32" height="32" fill="#9a968c"/>
  <rect x="246" y="165" width="28" height="4" fill="#f0b45a"/>

  <!-- background plants along the back glass, side plants -->
  <g fill="#5e9a5e" opacity="0.75">
    <circle cx="96" cy="88" r="22"/><circle cx="140" cy="80" r="16"/><circle cx="190" cy="92" r="20"/><circle cx="320" cy="84" r="14"/>
    <circle cx="372" cy="90" r="18"/><circle cx="480" cy="84" r="22"/><circle cx="530" cy="96" r="15"/><circle cx="584" cy="86" r="20"/>
    <circle cx="592" cy="290" r="18"/><circle cx="588" cy="340" r="14"/><circle cx="96" cy="200" r="18"/><circle cx="88" cy="250" r="13"/>
  </g>
  <!-- foreground plants: left and right of the camera -->
  <g fill="#8fcf8f" opacity="0.85">
    <circle cx="160" cy="420" r="30"/><circle cx="200" cy="452" r="24"/><circle cx="140" cy="468" r="20"/><circle cx="218" cy="404" r="16"/>
    <circle cx="500" cy="430" r="30"/><circle cx="540" cy="404" r="22"/><circle cx="470" cy="470" r="20"/><circle cx="548" cy="462" r="18"/>
  </g>

  <!-- desk and furniture -->
  <g stroke="#e8e4d8" stroke-width="2" fill="#0d0d0d">
    <rect x="268" y="212" width="144" height="60"/>
    <rect x="376" y="216" width="34" height="48" stroke-dasharray="4 3" fill="none"/>
    <rect x="350" y="226" width="20" height="22"/>
    <rect x="298" y="226" width="44" height="7" transform="rotate(-8 320 229)"/>
    <rect x="282" y="234" width="18" height="16"/>
    <rect x="425" y="220" width="30" height="40"/>
    <circle cx="248" cy="262" r="16"/>
    <circle cx="356" cy="304" r="26"/>
    <rect x="342" y="290" width="28" height="24" transform="rotate(15 356 302)"/>
  </g>
  <rect x="352" y="244" width="16" height="3" fill="#bfe3ff"/>
  <!-- lamp: clamp and arm -->
  <circle cx="274" cy="216" r="4" fill="#e8e4d8"/><line x1="274" y1="216" x2="328" y2="238" stroke="#e8e4d8" stroke-width="2"/><circle cx="328" cy="238" r="6" fill="#f0b45a"/>

  <!-- camera and field of view -->
  <path d="M360,508 L180,160 L520,160 Z" fill="url(#fov)"/>
  <line x1="360" y1="508" x2="180" y2="160" stroke="#f0b45a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="360" y1="508" x2="520" y2="160" stroke="#f0b45a" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="350" y="502" width="20" height="14" fill="#f0b45a"/><path d="M356,502 L364,502 L368,494 L352,494 Z" fill="#f0b45a"/>

  <!-- passages -->
  <path d="M352,512 Q210,500 96,428" fill="none" stroke="#f0b45a" stroke-width="3" marker-end="url(#a1)"/>
  <path d="M372,500 Q560,330 612,184" fill="none" stroke="#8fcf8f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>

  <!-- object numbers -->
  <g font-size="10" font-weight="700" text-anchor="middle">
    <g fill="#e8e4d8">
      <circle cx="300" cy="200" r="9"/><circle cx="392" cy="290" r="9"/><circle cx="330" cy="304" r="9"/><circle cx="470" cy="214" r="9"/>
      <circle cx="368" cy="214" r="9"/><circle cx="318" cy="250" r="9"/><circle cx="262" cy="240" r="9"/><circle cx="226" cy="262" r="9"/>
      <circle cx="260" cy="182" r="9"/>
    </g>
    <g fill="#0d0d0d">
      <text x="300" y="204">1</text><text x="392" y="294">2</text><text x="330" y="308">3</text><text x="470" y="218">4</text>
      <text x="368" y="218">5</text><text x="318" y="254">7</text><text x="262" y="244">8</text><text x="226" y="266">9</text>
      <text x="260" y="186">14</text>
    </g>
  </g>

  <!-- labels -->
  <g font-size="11" fill="#e8e4d8">
    <text x="72" y="376" font-weight="700">PORTE DE L'ESCALIER</text>
    <text x="72" y="362" fill="#f0b45a">scroll ↓</text>
    <text x="602" y="132" text-anchor="end" font-weight="700" fill="#8fcf8f">PORTE VITRÉE → LE TOIT</text>
    <text x="340" y="534" text-anchor="middle" fill="#f0b45a">CAMÉRA · 35 mm · 1,10 m</text>
    <text x="340" y="76" text-anchor="middle" fill="#7fa8c8">verrière (vitrage, structure noire)</text>
    <text x="120" y="512" fill="#8fcf8f">premier plan</text>
    <text x="520" y="512" fill="#8fcf8f">premier plan</text>
  </g>
  <!-- dimensions -->
  <g stroke="#9a968c" stroke-width="1" fill="#9a968c" font-size="10">
    <line x1="60" y1="560" x2="620" y2="560"/><line x1="60" y1="555" x2="60" y2="565"/><line x1="620" y1="555" x2="620" y2="565"/>
    <text x="340" y="576" text-anchor="middle" stroke="none">7,00 m</text>
    <line x1="636" y1="60" x2="636" y2="540"/><line x1="631" y1="60" x2="641" y2="60"/><line x1="631" y1="540" x2="641" y2="540"/>
    <text x="650" y="304" stroke="none" transform="rotate(90 650 304)" text-anchor="middle">6,00 m · hauteur 3,20 m</text>
    <line x1="60" y1="600" x2="140" y2="600" stroke="#e8e4d8" stroke-width="3"/><text x="150" y="604" fill="#e8e4d8" stroke="none">1 m</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#e8e4d8">
    <text x="680" y="80" font-weight="700">OBJETS</text>
    <text x="680" y="102">1  bureau</text>
    <text x="680" y="120">2  caisson à tiroirs</text>
    <text x="680" y="138">3  chaise (vide)</text>
    <text x="680" y="156">4  tour de rangement</text>
    <text x="680" y="174">   et cartons</text>
    <text x="680" y="192">5  le Mac</text>
    <text x="680" y="210">7  grand écran éteint</text>
    <text x="680" y="228">8  lampe d'architecte</text>
    <text x="680" y="246">   (livres juste devant)</text>
    <text x="680" y="264">9  ventilateur au sol</text>
    <text x="680" y="282">14 tableau en liège</text>
    <text x="680" y="300">   sur le pilier</text>
    <text x="680" y="340" font-weight="700">REPÈRES</text>
    <rect x="680" y="352" width="14" height="10" fill="#9a968c"/><text x="702" y="361">pilier en béton</text>
    <circle cx="687" cy="380" r="7" fill="#8fcf8f"/><text x="702" y="384">plantes, premier plan</text>
    <circle cx="687" cy="402" r="7" fill="#5e9a5e"/><text x="702" y="406">plantes, fond</text>
    <line x1="680" y1="424" x2="694" y2="424" stroke="#7fa8c8" stroke-width="2"/><text x="702" y="428">vitrage</text>
    <line x1="680" y1="446" x2="694" y2="446" stroke="#f0b45a" stroke-width="3"/><text x="702" y="450">sortie au scroll</text>
    <line x1="680" y1="468" x2="694" y2="468" stroke="#8fcf8f" stroke-width="2" stroke-dasharray="4 3"/><text x="702" y="472">passage au clic</text>
    <text x="680" y="510" fill="#9a968c" font-size="10">positions de départ,</text>
    <text x="680" y="524" fill="#9a968c" font-size="10">ajustées à l'étape 1</text>
    <text x="680" y="538" fill="#9a968c" font-size="10">(volumes et cadrage)</text>
  </g>
</svg>
