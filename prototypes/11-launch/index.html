<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype 11 · Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@500..800&family=JetBrains+Mono:wght@800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.5 "Share Tech Mono", ui-monospace, monospace;
    color: #999; opacity: .6; pointer-events: none; white-space: pre;
    mix-blend-mode: difference;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<script src="../shared/pictos.js"></script>
<script src="../shared/grid.js"></script>
<script src="../shared/crt.js"></script>
<script>
// Prototype 11 — LAUNCH: button blink, hard cut, texts erased backwards, boot log typed while a storm
// grows in from the edges, cut to black, then the detail page (placeholder for now).
// Timings measured on the reference at 60 fps (frames are relative to the click).
// Mouse: LAUNCH, drag the screen to orbit. Keys: Esc / R back to the panel, V storm style, S slow motion,
// I invert, H label. URL params: ?inv=0|1&storm=0|1&hud=0|1&freeze=1&auto=<frame>

const FPS = 60;
const params = new URLSearchParams(location.search);
let inverted = params.get('inv') === '1';
let showHud = params.get('hud') !== '0';
let stormKind = params.get('storm') === '1' ? 1 : 0;
const STORMS = ['phosphor blotches', 'static snow'];
const freeze = params.get('freeze') === '1';
const CELL = 7;

const PROJECT = {
  title: 'GPT-2 FROM SCRATCH',
  view: ['MODEL', '12 LAYERS x 12 HEADS, DRAG TO ORBIT'],
  language: 'PYTHON', year: '2026', type: 'DEEP LEARNING', duration: '6 WEEKS',
  composition: [['PYTHON', 91], ['JUPYTER', 7], ['SHELL', 2]],
  stack: ['PYTORCH', 'NUMPY', 'MATPLOTLIB'],
  modelTitle: 'MODEL', model: ['124M PARAMETERS', '12 LAYERS x 12 HEADS', '50 257 TOKEN VOCAB'],
  description: ['GPT-2 (124M) rebuilt from scratch in PyTorch:', 'tokenizer, transformer and training loop,', 'trained until it matches the original results.'],
  // project-specific lines of the boot log
  log: ['Loading tokenizer ... BPE, 50 257 tokens', 'Building transformer: 12 layers x 12 heads', 'Restoring checkpoint: step 19073', 'Validation loss: 3.07   target: 3.28   OK'],
  media: { images: 14, videos: 3, files: 12 },
};
const ALPHA = [0.55, 0.75, 0.9, 1];

// Launch timeline, frames after the click
const SEQ = {
  cut: 8,            // button blinks (on 3, off 3, on 2), then hard cut
  erase: 14,         // texts erased backwards, bottom line first, accelerating
  type: 23,          // boot log starts (cut + 15)
  typeFrames: 118,   // log typed in ~2 s, accelerating
  storm: 62,         // storm starts 62 frames into the log, saturates at its end
  afterglow: 22,     // faint residue after the cut to black
  detail: 30,        // then black, then the detail page
};
const LIFT = [0.06, 0, 0, 0, 0.06, 0.06, 0.06, 0.06];   // background flicker right after the cut

const L = {
  band: [420, 1150], screen: [300, 345, 850, 585],
  back: [300, 960, 220, 65], github: [1200, 920, 310, 110], launch: [1540, 920, 320, 110],
};

const canvas = document.getElementById('gl');
const hud = document.getElementById('hud');
const crt = createCRT(canvas);
const uiCanvas = document.createElement('canvas');
const ui = uiCanvas.getContext('2d');
const staticCanvas = document.createElement('canvas');
const sctx = staticCanvas.getContext('2d');
let ctx = sctx, dpr, layout, capRatio = 0.6, w, h, u;
let hoverId = null, launchAt = params.get('auto') ? Number(params.get('auto')) : null;
let texts = [];          // every text drawn on the static panel, for the erase phase

// ---- drawing helpers, in design coordinates -------------------------------------------
const X = v => v / 1920 * w, Y = v => v / 1080 * h;
function R(x, y, rw, rh, col = ON) { ctx.fillStyle = col; ctx.fillRect(X(x), Y(y), X(rw), Y(rh)); }
function box(x, y, bw, bh, t, col = ON) {
  ctx.fillStyle = col;
  const px = X(x), py = Y(y), pw = X(bw), ph = Y(bh);
  ctx.fillRect(px, py, pw, t); ctx.fillRect(px, py + ph - t, pw, t);
  ctx.fillRect(px, py, t, ph); ctx.fillRect(px + pw - t, py, t, ph);
}
function setFont(cap, weight = 700) { ctx.font = `${weight} ${Math.round(cap * u / capRatio)}px "Handjet", monospace`; }
function rawText(str, px, py, align = 'left', color = ON) {
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color; ctx.fillText(str, px, py);
  if (ctx === sctx) texts.push({ str, px, py, align, font: ctx.font });
}
function text(str, x, y, cap, { align = 'left', color = ON, weight = 700 } = {}) { setFont(cap, weight); rawText(str, X(x), Y(y), align, color); }
const textW = (str, cap, weight = 700) => { setFont(cap, weight); return ctx.measureText(str).width / w * 1920; };
function arrow(cx, cy, s, dir, col = ON) {
  const x = X(cx), y = Y(cy), k = s * u;
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + dir * k * 0.5, y); ctx.lineTo(x, y - k * 0.45); ctx.lineTo(x, y - k * 0.18);
  ctx.lineTo(x - dir * k * 0.5, y - k * 0.18); ctx.lineTo(x - dir * k * 0.5, y + k * 0.18);
  ctx.lineTo(x, y + k * 0.18); ctx.lineTo(x, y + k * 0.45); ctx.closePath(); ctx.fill();
}
function branchIcon(cx, cy, s, col) {
  const k = s * u, x = X(cx), y = Y(cy);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = k * 0.14;
  ctx.beginPath(); ctx.moveTo(x - k * 0.25, y - k * 0.38); ctx.lineTo(x - k * 0.25, y + k * 0.38);
  ctx.moveTo(x + k * 0.25, y - k * 0.2); ctx.quadraticCurveTo(x + k * 0.25, y + k * 0.12, x - k * 0.25, y + k * 0.18); ctx.stroke();
  for (const [ox, oy] of [[-0.25, -0.42], [-0.25, 0.42], [0.25, -0.28]]) { ctx.beginPath(); ctx.arc(x + ox * k, y + oy * k, k * 0.13, 0, Math.PI * 2); ctx.fill(); }
}
const inRect = (px, py, [x, y, bw, bh]) => px >= x && px < x + bw && py >= y && py < y + bh;

// ---- panel (prototype 10) -----------------------------------------------------------------
function drawHeader() {
  const { C } = layout;
  const cx = X(270), cy = Y(206), Lw = C * 0.068, K = C * 0.05;
  ctx.fillStyle = OFF; ctx.fillRect(w * 0.027 - K, cy - Lw / 2 - K, w * 0.946 + 2 * K, Lw + 2 * K); ctx.fillRect(cx - Lw / 2 - K, h * 0.015 - K, Lw + 2 * K, h * 0.97 + 2 * K);
  ctx.fillStyle = ON; ctx.fillRect(w * 0.027, cy - Lw / 2, w * 0.946, Lw); ctx.fillRect(cx - Lw / 2, h * 0.015, Lw, h * 0.97);
  const x = cx - C / 2, y = cy - C / 2, S = C * 0.865;
  ctx.fillStyle = OFF; ctx.fillRect(x, y, C, C);
  ctx.fillStyle = ON; ctx.fillRect(x + (C - S) / 2, y + (C - S) / 2, S, S);
  drawPictoInverted(ctx, GRID[CELL], x, y, C, 1, 0.865);
  const bt = C * 0.07, arm = C * 0.35, off = C * 0.15, bs = C + off * 2, bx = cx - bs / 2, by = cy - bs / 2;
  ctx.fillStyle = ON;
  for (const [sx, sy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
    const px = bx + sx * bs, py = by + sy * bs;
    ctx.fillRect(sx ? px - arm : px, sy ? py - bt : py, arm, bt);
    ctx.fillRect(sx ? px - bt : px, sy ? py - arm : py, bt, arm);
  }
  const lx = cx + C / 2 + off + C * 0.1;
  ctx.font = `700 ${Math.round(C * 0.15)}px "Handjet", monospace`;
  rawText(`Archive entry ${String(CELL + 1).padStart(2, '0')} located. Opening file ...`, lx, cy - 0.64 * C);
  setFont(0.3 * 180.48); rawText(`ENTRY ${String(CELL + 1).padStart(2, '0')}: ${PROJECT.title}`, lx, cy - 0.2 * C);
}
function button(id, [x, y, bw, bh], label, cap, t, icon, forced) {
  const on = forced ?? hoverId === id;
  if (on) R(x, y, bw, bh); else box(x, y, bw, bh, t);
  const col = on ? OFF : ON;
  const tw = textW(label, cap), iw = icon ? cap * 1.5 : 0, x0 = x + (bw - tw - iw) / 2;
  if (icon === 'back') arrow(x0 + cap * 0.55, y + bh / 2, cap * 1.1, -1, col);
  if (icon === 'git') branchIcon(x0 + cap * 0.5, y + bh / 2, cap * 1.3, col);
  text(label, x0 + iw, y + bh / 2 + cap / 2, cap, { color: col });
}
function block(x, y0, label, value) { text(label, x, y0 + 26, 15, { weight: 600 }); text(value, x, y0 + 72, 26); }
function swatch(kind, x, y, sw, sh, thin) {
  if (kind === 0) { R(x, y, sw, sh); return; }
  ctx.save(); ctx.beginPath(); ctx.rect(X(x), Y(y), X(sw), Y(sh)); ctx.clip();
  if (kind === 1) {
    ctx.strokeStyle = ON; ctx.lineWidth = 4 * u; ctx.beginPath();
    for (let k = -sh; k < sw; k += 12) { ctx.moveTo(X(x + k), Y(y + sh)); ctx.lineTo(X(x + k + sh), Y(y)); }
    ctx.stroke();
  } else for (let yy = y + 5; yy < y + sh - 2; yy += 10) for (let xx = x + 5; xx < x + sw - 2; xx += 10) R(xx - 2, yy - 2, 4, 4);
  ctx.restore();
  box(x, y, sw, sh, thin * 0.7);
}
function list(x, y, title, items, step = 38) {
  text(title, x, y, 15, { weight: 600 });
  items.forEach((s, i) => { R(x, y + 23 + i * step, 14, 14); text(s, x + 30, y + 38 + i * step, 19); });
}

function drawStatic(launchLit) {
  ctx = sctx; texts = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = OFF; ctx.fillRect(0, 0, w, h);
  drawHeader();
  const st = layout.C * 0.05, thin = layout.C * 0.036;
  const [b0, b1] = L.band, [sx, sy, sw, sh] = L.screen;
  R(b0, 250, 150, 44); text('LIVE', b0 + 75, 284, 22, { align: 'center', color: OFF });
  text(`${PROJECT.view[0]}  -  ${PROJECT.view[1]}`, b0 + 174, 284, 20);
  text(`${grid.cols}x${grid.rows}`, b1, 284, 20, { align: 'right' });
  for (let x = b0; x <= b1; x += 16) R(x, 308, 6, 22);
  box(sx, sy, sw, sh, st);
  button('back', L.back, 'BACK', 22, thin, 'back');
  text('OR PRESS ESC', 545, 1002, 15, { weight: 600 });
  button('github', L.github, 'GITHUB', 24, thin, 'git');
  button('launch', L.launch, 'LAUNCH', 36, st, null, launchLit);

  const x0 = 1200, x1 = 1540, xr = 1860;
  block(x0, 250, 'LANGUAGE', PROJECT.language); block(x1, 250, 'YEAR', PROJECT.year);
  R(x0, 340, xr - x0, thin / u);
  block(x0, 355, 'TYPE', PROJECT.type); block(x1, 355, 'DURATION', PROJECT.duration);
  R(x0, 445, xr - x0, thin / u);
  text('COMPOSITION', x0, 490, 15, { weight: 600 });
  let cx = x0;
  PROJECT.composition.forEach(([, pct], i) => { const pw = (xr - x0) * pct / 100; swatch(i, cx, 506, pw, 34, thin); cx += pw; });
  cx = x0;
  PROJECT.composition.forEach(([name, pct], i) => {
    swatch(i, cx, 562, 18, 18, layout.C * 0.03);
    const label = `${name} ${pct}%`;
    text(label, cx + 28, 578, 16, { weight: 600 });
    cx += 28 + textW(label, 16, 600) + 34;
  });
  R(x0, 602, xr - x0, thin / u);
  list(x0, 645, 'STACK', PROJECT.stack);
  list(x1, 645, PROJECT.modelTitle, PROJECT.model);
  PROJECT.description.forEach((line, i) => text(line, x0, 818 + i * 36, 17, { weight: 600 }));
  // erase order: bottom line first, then upwards
  texts.sort((a, b) => b.py - a.py || b.px - a.px);
}

// ---- ASCII view (prototype 10) ----------------------------------------------------------------
function makeGrid(cols, rows) { return { cols, rows, chars: new Uint16Array(cols * rows), levels: new Int8Array(cols * rows).fill(-1) }; }
function puts(g, i, j, str, lvl) {
  for (let k = 0; k < str.length; k++) {
    if (str[k] === ' ' || i + k < 0 || i + k >= g.cols || j < 0 || j >= g.rows) continue;
    const idx = j * g.cols + i + k; g.chars[idx] = str.charCodeAt(k); g.levels[idx] = lvl;
  }
}
const cam = { yaw: 0.7, pitch: -0.42, dist: 4.2, vyaw: 0, vpitch: 0 };
function rotInv([x, y, z], yaw, pitch) {
  const c = Math.cos(-yaw), s = Math.sin(-yaw);
  [x, z] = [x * c + z * s, -x * s + z * c];
  const cp = Math.cos(-pitch), sp = Math.sin(-pitch);
  return [x, y * cp - z * sp, y * sp + z * cp];
}
const N = 12, RING = 12, RADIUS = 0.8, GAP = 0.19;
function tower(cols, rows, aw, lh, t) {
  const g = makeGrid(cols, rows), depth = new Float32Array(cols * rows).fill(1e9);
  const half = rows * lh / 2, f = 0.42;
  const pulse = Math.floor(t * 4) % (N + 3);
  const pts = [];
  for (let l = 0; l < N; l++) for (let k = 0; k < RING; k++) {
    const a = k / RING * Math.PI * 2;
    const c = rotInv([RADIUS * Math.cos(a), (l - (N - 1) / 2) * GAP, RADIUS * Math.sin(a)], cam.yaw, cam.pitch);
    const cn = rotInv([Math.cos(a), 0, Math.sin(a)], cam.yaw, cam.pitch);
    const zc = cam.dist - c[2];
    pts.push({ i: cols / 2 + c[0] / zc / f * half / aw, j: rows / 2 - c[1] / zc / f * half / lh, z: zc, front: cn[2] > -0.15, l });
  }
  const plot = (i, j, ch, z, lvl) => {
    i = Math.round(i); j = Math.round(j);
    if (i < 0 || j < 0 || i >= cols || j >= rows) return;
    const k = j * cols + i;
    if (lvl > g.levels[k] || (lvl === g.levels[k] && z < depth[k])) { depth[k] = z; g.levels[k] = lvl; g.chars[k] = ch.charCodeAt(0); }
  };
  const edge = (p, q, hot) => {
    const di = q.i - p.i, dj = q.j - p.j, n = Math.ceil(Math.max(Math.abs(di), Math.abs(dj)) * 1.3) + 1;
    const dx = di * aw, dy = dj * lh, ang = Math.abs(Math.atan2(dy, dx));
    const front = p.front && q.front;
    const ch = ang < 0.39 || ang > 2.75 ? '-' : ang > 1.18 && ang < 1.96 ? '|' : (dx * dy > 0 ? '\\' : '/');
    for (let s = 0; s <= n; s++) {
      const tt = s / n;
      plot(p.i + di * tt, p.j + dj * tt, front ? ch : '.', p.z + (q.z - p.z) * tt, hot ? 3 : front ? 2 : 0);
    }
  };
  for (let l = 0; l < N; l++) for (let k = 0; k < RING; k++) {
    const p = pts[l * RING + k];
    edge(p, pts[l * RING + (k + 1) % RING], l === pulse && p.front);
    if (l < N - 1 && k % 2 === 0) edge(p, pts[(l + 1) * RING + k], false);
  }
  for (const p of pts) if (p.front) plot(p.i, p.j, p.l === pulse ? '@' : 'o', p.z - 0.01, p.l === pulse ? 3 : 2);
  puts(g, 1, 0, pulse < N ? `LAYER ${String(pulse + 1).padStart(2, '0')} / ${N}` : 'SAMPLING ...', 2);
  puts(g, 1, rows - 1, 'TOKENS IN', 1); puts(g, cols - 12, 0, 'LOGITS OUT', 1);
  return g;
}
function drawGrid(g, x0, y0, aw, lh, fs) {
  ui.font = `800 ${fs}px "JetBrains Mono", monospace`;
  ui.textBaseline = 'top'; ui.textAlign = 'left'; ui.fillStyle = ON;
  for (let lvl = 0; lvl < 4; lvl++) {
    ui.globalAlpha = ALPHA[lvl];
    for (let j = 0; j < g.rows; j++) {
      let line = '', any = false;
      for (let i = 0; i < g.cols; i++) {
        const k = j * g.cols + i;
        if (g.levels[k] === lvl) { line += String.fromCharCode(g.chars[k]); any = true; } else line += ' ';
      }
      if (any) ui.fillText(line, x0, y0 + j * lh);
    }
  }
  ui.globalAlpha = 1;
}
let grid = { cols: 0, rows: 0, aw: 0, lh: 0, fs: 0 };
function measureGrid() {
  const [, , sw, sh] = L.screen, inset = 22, fs = 11 * u;
  ui.font = `800 ${fs}px "JetBrains Mono", monospace`;
  const aw = ui.measureText('M').width, lh = fs * 1.08;
  grid = { fs, aw, lh, cols: Math.floor((X(sw) - X(2 * inset)) / aw), rows: Math.floor((Y(sh) - Y(2 * inset)) / lh) };
}

// ---- launch phases ----------------------------------------------------------------------------
function bootLog(p) {
  const id = String(CELL + 1).padStart(2, '0');
  return [
    `Entry ${id} located. Mounting archive ...`,
    `Project: ${p.title}`,
    `Language: ${p.language}   Type: ${p.type}   Year: ${p.year}`,
    `Stack: ${p.stack.join(', ')}`,
    '',
    ...p.log,
    '',
    'Decompressing media ...',
    `Images: ${p.media.images}/${p.media.images}`,
    `Videos: ${p.media.videos}/${p.media.videos}`,
    `Source files: ${p.media.files}/${p.media.files}`,
    '',
    'Rendering project file ...',
    'Display mode: FULL COLOR',
    'Launch sequence complete.',
  ];
}
const LOG = bootLog(PROJECT);
const LOG_CHARS = LOG.reduce((n, l) => n + l.length, 0);

function drawErase(e) {
  // every remaining text is backspaced; items start one after another from the bottom, faster and faster
  const K = texts.length, fade = Math.max(0, Math.min(1, (e - 10) / 4));
  ui.save(); ui.globalAlpha = 1 - fade;
  texts.forEach((t, k) => {
    const p = Math.max(0, Math.min(1, (e - k / K * 6) / 7)) ** 1.6;
    const n = Math.ceil(t.str.length * (1 - p));
    if (n <= 0) return;
    // keep the remaining characters where they were: draw from the text's original left edge
    ui.font = t.font; ui.textAlign = 'left'; ui.textBaseline = 'alphabetic'; ui.fillStyle = ON;
    const full = ui.measureText(t.str).width;
    const left = t.align === 'right' ? t.px - full : t.align === 'center' ? t.px - full / 2 : t.px;
    ui.fillText(t.str.slice(0, n), left, t.py);
  });
  ui.restore();
}
function drawTerminal(k) {
  const shown = Math.floor(LOG_CHARS * Math.min(1, k / SEQ.typeFrames) ** 1.15);
  // bold monospace, ~14 px per character at 1080p like the reference log
  ui.font = `800 ${22 * u}px "JetBrains Mono", monospace`; ui.textAlign = 'left'; ui.textBaseline = 'alphabetic'; ui.fillStyle = ON;
  let left = shown;
  LOG.forEach((line, i) => {
    if (left <= 0 && line) return;
    const part = line.slice(0, Math.max(0, left));
    left -= line.length;
    if (part) ui.fillText(part, X(64), Y(78 + i * 36));
  });
}
function drawDetailPlaceholder() {
  setFont(26); ui.textAlign = 'center'; ui.fillStyle = ON;
  ui.fillText(`ENTRY ${String(CELL + 1).padStart(2, '0')}: ${PROJECT.title}`, w / 2, h / 2 - Y(20));
  setFont(16, 600);
  ui.fillText('DETAIL PAGE  -  NEXT STEP          R  REPLAY', w / 2, h / 2 + Y(30));
}

// state of the screen at frame f (pure, so the sequence can be exported frame by frame)
function stateAt(f) {
  if (launchAt === null || f < launchAt) return { phase: 'panel' };
  const rel = f - launchAt;
  if (rel < SEQ.cut) return { phase: 'press', lit: rel < 3 || rel >= 6 };
  if (rel < SEQ.cut + SEQ.erase) return { phase: 'erase', e: rel - SEQ.cut, lift: LIFT[rel - SEQ.cut] ?? 0 };
  if (rel < SEQ.type) return { phase: 'empty' };
  const k = rel - SEQ.type;
  if (k <= SEQ.typeFrames) {
    const s = Math.max(0, Math.min(1, (k - SEQ.storm) / (SEQ.typeFrames - SEQ.storm)));
    return { phase: 'terminal', k };   // storm removed at the user's request
  }
  const a = k - SEQ.typeFrames - 1;
  if (a < SEQ.afterglow) return { phase: 'afterglow', blank: 0.9 + 0.1 * a / SEQ.afterglow };
  if (a < SEQ.afterglow + SEQ.detail) return { phase: 'black', blank: 1 };
  return { phase: 'detail' };
}

let lastPhaseKey = '';
function renderFrame(f) {
  const s = stateAt(f), t = f / FPS;
  const key = s.phase === 'press' ? `press${s.lit}` : s.phase;
  if (key !== lastPhaseKey && (s.phase === 'panel' || s.phase === 'press')) drawStatic(s.phase === 'press' ? s.lit : undefined);
  lastPhaseKey = key;

  ctx = ui;
  ui.setTransform(1, 0, 0, 1, 0, 0);
  ui.fillStyle = OFF; ui.fillRect(0, 0, uiCanvas.width, uiCanvas.height);
  if (s.phase === 'panel' || s.phase === 'press') ui.drawImage(staticCanvas, 0, 0);
  ui.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (s.phase === 'panel' || s.phase === 'press') {
    const [sx, sy, sw, sh] = L.screen, inset = 22, { cols, rows, aw, lh, fs } = grid;
    const x0 = X(sx + inset) + (X(sw - 2 * inset) - cols * aw) / 2, y0 = Y(sy + inset) + (Y(sh - 2 * inset) - rows * lh) / 2;
    drawGrid(tower(cols, rows, aw, lh, t), x0, y0, aw, lh, fs);
  }
  if (s.phase === 'erase') drawErase(s.e);
  if (s.phase === 'terminal') drawTerminal(s.k);
  if (s.phase === 'detail') drawDetailPlaceholder();

  crt.upload(uiCanvas);
  crt.render(t, { inverted, lift: s.lift || 0, storm: s.storm || 0, stormKind, blank: s.blank || 0 });
  hud.style.display = showHud ? 'block' : 'none';
  const rel = launchAt === null ? null : f - launchAt;
  hud.textContent = `${s.phase}${rel !== null && rel >= 0 ? `  (launch +${rel})` : ''} · storm ${STORMS[stormKind]}${slow ? ' · ×0.25' : ''}${inverted ? ' · inverted' : ''}\n` +
    `LAUNCH · drag to orbit · Esc / R panel · V storm style · S slow · I invert · H hide`;
}

// ---- loop + input ---------------------------------------------------------------------------
let drag = null, lastInput = -1e9, slow = false, vt = 0, last = performance.now(), frameNow = 0;
function loop(now) {
  vt += (now - last) / 1000 * (slow ? 0.25 : 1); last = now;
  frameNow = Math.floor(vt * FPS);
  if (!drag) {
    cam.yaw += cam.vyaw; cam.pitch += cam.vpitch; cam.vyaw *= 0.94; cam.vpitch *= 0.9;
    if (now - lastInput > 2500) cam.yaw += 0.004;
  }
  cam.pitch = Math.max(-1.2, Math.min(1.2, cam.pitch));
  renderFrame(frameNow);
  requestAnimationFrame(loop);
}
const design = e => [e.clientX / w * 1920, e.clientY / h * 1080];
const onPanel = () => stateAt(frameNow).phase === 'panel';
function targetAt(px, py) {
  for (const id of ['back', 'github', 'launch']) if (inRect(px, py, L[id])) return id;
  return inRect(px, py, L.screen) ? 'screen' : null;
}
canvas.addEventListener('pointerdown', e => {
  if (!onPanel()) return;
  lastInput = performance.now();
  const target = targetAt(...design(e));
  if (target === 'launch') { launchAt = frameNow; canvas.style.cursor = 'default'; return; }
  if (target !== 'screen') return;
  drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    cam.yaw -= dx * 0.008; cam.pitch -= dy * 0.006; cam.vyaw = -dx * 0.008; cam.vpitch = -dy * 0.006;
    drag = { x: e.clientX, y: e.clientY }; lastInput = performance.now();
    return;
  }
  if (!onPanel()) { canvas.style.cursor = 'default'; return; }
  const target = targetAt(...design(e)), id = target === 'screen' ? null : target;
  canvas.style.cursor = target === 'screen' ? 'grab' : target ? 'pointer' : 'default';
  if (id !== hoverId) { hoverId = id; lastPhaseKey = ''; }
});
addEventListener('pointerup', () => { if (drag) { drag = null; canvas.style.cursor = 'grab'; } });
canvas.addEventListener('wheel', e => {
  if (!onPanel() || targetAt(...design(e)) !== 'screen') return;
  cam.dist = Math.max(2.6, Math.min(7, cam.dist * (1 + e.deltaY * 0.001)));
  lastInput = performance.now(); e.preventDefault();
}, { passive: false });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape' || k === 'r') { launchAt = null; hoverId = null; lastPhaseKey = ''; }
  if (k === 'v') stormKind = 1 - stormKind;
  if (k === 's') slow = !slow;
  if (k === 'i') inverted = !inverted;
  if (k === 'h') showHud = !showHud;
});

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 1.5);
  w = innerWidth; h = innerHeight;
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  crt.resize(W, H);
  uiCanvas.width = staticCanvas.width = W; uiCanvas.height = staticCanvas.height = H;
  layout = gridLayout(w, h);
  u = layout.C / 180.48;
  ctx = ui; ui.setTransform(dpr, 0, 0, dpr, 0, 0);
  measureGrid();
  lastPhaseKey = '';
}
addEventListener('resize', resize);

Promise.all([
  document.fonts.load('700 40px "Handjet"'), document.fonts.load('600 40px "Handjet"'),
  document.fonts.load('800 20px "JetBrains Mono"'), document.fonts.load('12px "Share Tech Mono"'),
]).finally(() => {
  sctx.font = '700 100px "Handjet"';
  capRatio = sctx.measureText('E').actualBoundingBoxAscent / 100 || 0.6;
  resize();
  window.__setFrame = f => { frameNow = f; renderFrame(f); };
  if (!freeze) requestAnimationFrame(loop);
  window.__ready = true;
});
</script>
</body>
