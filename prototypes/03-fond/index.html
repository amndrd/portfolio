<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype 03 · Backgrounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@500..800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.5 "Share Tech Mono", ui-monospace, monospace;
    color: #999; opacity: .6; pointer-events: none; white-space: pre;
    mix-blend-mode: difference;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<script src="../shared/pictos.js"></script>
<script>
// Prototype 03 — background options without smoke, warm white worn UI, inverted mode, decor layers.
// Keys: B cycles background, I inverts, D cycles decor, U toggles the UI, H toggles this label.
// URL params: ?bg=0..4&inv=0|1&d=none|minimal|technique|dossier&ui=0|1&hud=0|1

const BACKGROUNDS = ['black + grain', 'dot grid', 'technical grid', 'paper', 'halftone'];
const DECORS = ['none', 'minimal', 'technique', 'dossier'];
const PALETTE = ['#030302', '#121210', '#4d4c47', '#ecebe3', '#ffffff'];
const PALETTE_INV = ['#eeece4', '#e1dfd6', '#a19f96', '#1a1916', '#050504'];

const P = {
  cellOfWidth: 0.094, cellOfHeight: 0.17, gap: 0.165, outline: 0.05, pictoBox: 0.74,
  line: 0.068, knock: 0.05, bracket: 0.053, bracketArm: 0.35, bracketOffset: 0.15, label: 0.15,
};
const TARGET = { col: 3, row: 1 };

const params = new URLSearchParams(location.search);
let bg = Math.min(4, Math.max(0, Number(params.get('bg') || 0)));
let inverted = params.get('inv') === '1';
let decor = DECORS.includes(params.get('d')) ? params.get('d') : 'none';
let showUI = params.get('ui') !== '0';
let showHud = params.get('hud') !== '0';

const canvas = document.getElementById('gl');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });

const VERT = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uTex;
uniform vec2 uDir;
void main() {
  float w[5] = float[](0.227, 0.194, 0.121, 0.054, 0.016);
  vec3 s = texture(uTex, vUv).rgb * w[0];
  for (int i = 1; i < 5; i++) {
    s += texture(uTex, vUv + uDir * float(i)).rgb * w[i];
    s += texture(uTex, vUv - uDir * float(i)).rgb * w[i];
  }
  o = vec4(s, 1.0);
}`;

const FINAL = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uUI;
uniform sampler2D uBloom;
uniform vec2 uRes, uOrigin;
uniform float uTime, uShowUI, uBg, uPitch;
uniform vec3 uC0, uC1, uC2, uC3, uC4;

float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; }
  return v;
}
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

vec3 ramp(float x) {
  if (x < 0.07) return mix(uC0, uC1, x / 0.07);
  if (x < 0.35) return mix(uC1, uC2, (x - 0.07) / 0.28);
  if (x < 0.90) return mix(uC2, uC3, (x - 0.35) / 0.55);
  return mix(uC3, uC4, clamp((x - 0.90) / 0.4, 0.0, 1.0));
}

float band(float y, float speed, float offset, float width) {
  float c = 1.0 - fract(offset + uTime * speed);
  float d = abs(y - c); d = min(d, 1.0 - d);
  return exp(-pow(d / width, 2.0));
}

float wearMask(vec2 frag, float gs) {
  float speck  = smoothstep(0.90, 0.96, noise(frag / (2.6 * gs)));
  float speck2 = smoothstep(0.91, 0.97, noise(frag / (7.0 * gs) + 5.0));
  vec2 q = frag / (45.0 * gs);
  q += vec2(fbm(q * 0.7), fbm(q * 0.7 + 5.2)) * 1.6;
  float dirt = smoothstep(0.60, 0.70, fbm(q));
  float film = noise(frag / (1.6 * gs) + 9.0);
  float m = 1.0;
  m *= 1.0 - speck * 0.55;
  m *= 1.0 - speck2 * 0.5;
  m *= 1.0 - dirt * (0.55 + 0.3 * film);
  m *= 1.0 - 0.05 * film;
  return m;
}

// distance in px to the nearest line of a grid with the given spacing (px)
vec2 lineDist(vec2 p, float spacing) { return (0.5 - abs(fract(p / spacing) - 0.5)) * spacing; }

float background(vec2 frag, vec2 uv, float gs) {
  float I = 0.035;
  float centre = smoothstep(0.95, 0.2, length((uv - 0.5) * vec2(1.0, 1.35)));
  vec2 g = frag - uOrigin;

  if (uBg > 0.5 && uBg < 1.5) {
    // dot grid: 4 dots per cell pitch, a brighter cross at every cell corner
    vec2 d = lineDist(g + uPitch / 8.0, uPitch / 4.0);
    float dotMinor = 1.0 - smoothstep(0.9 * gs, 1.8 * gs, length(d));
    vec2 dm = lineDist(g, uPitch);
    float cross = (1.0 - smoothstep(0.6 * gs, 1.3 * gs, min(dm.x, dm.y))) * step(max(dm.x, dm.y), 5.0 * gs);
    I += (dotMinor * 0.12 + cross * 0.22) * (0.35 + 0.65 * centre);
  } else if (uBg > 1.5 && uBg < 2.5) {
    // technical grid: fine lines every quarter pitch, stronger lines in the gutters between cells
    vec2 dMin = lineDist(g, uPitch / 4.0);
    vec2 dMaj = lineDist(g, uPitch);
    float minor = 1.0 - smoothstep(0.35 * gs, 1.0 * gs, min(dMin.x, dMin.y));
    float major = 1.0 - smoothstep(0.6 * gs, 1.4 * gs, min(dMaj.x, dMaj.y));
    I += (minor * 0.05 + major * 0.11) * (0.3 + 0.7 * centre);
  } else if (uBg > 2.5 && uBg < 3.5) {
    // paper / card stock: fibres in three directions + fine tooth, no large-scale clouds
    float fib = 0.0;
    for (int k = 0; k < 3; k++) {
      vec2 r = rot(float(k) * 2.1 + 0.4) * (frag / gs);
      fib += smoothstep(0.66, 0.92, noise(vec2(r.x * 0.018, r.y * 0.8) + float(k) * 13.0));
    }
    I += fib * 0.04 + (noise(frag / (1.3 * gs)) - 0.5) * 0.05 + (noise(frag / (420.0 * gs)) - 0.5) * 0.02;
  } else if (uBg > 3.5) {
    // halftone screen at 45°, dots grow toward the edges like a printed gradient
    vec2 r = rot(0.785) * (frag / gs);
    float cellPx = 7.0;
    float d = length(fract(r / cellPx) - 0.5) * cellPx;
    float amt = smoothstep(0.3, 1.0, length((uv - 0.5) * vec2(1.0, 1.5)));
    float radius = amt * cellPx * 0.45;
    I += (1.0 - smoothstep(radius - 0.7, radius + 0.7, d)) * 0.15;
  }
  return I;
}

void main() {
  vec2 frag = vUv * uRes;
  vec2 uv = vUv;
  vec2 px = 1.0 / uRes;
  float gs = max(1.0, uRes.y / 1000.0);
  float tick = floor(uTime * 15.0);

  float I = background(frag, uv, gs);

  float b1 = band(uv.y, 0.011, 0.33, 0.022);
  float b2 = band(uv.y, 0.007, 0.70, 0.030);
  float streak = noise(vec2(uv.x * 4.0 + tick * 0.7, uv.y * uRes.y * 0.35));
  I += (b1 + b2 * 0.8) * (0.012 + 0.035 * streak * streak);

  float g = hash(floor(frag / gs) + tick * 13.7) - 0.5;
  I += g * 0.03;

  vec2 erode = vec2(noise(frag / (6.0 * gs) + 11.0), noise(frag / (6.0 * gs) + 37.0)) - 0.5;
  float jitter = (b1 + b2) * (noise(vec2(uv.y * 90.0, tick)) - 0.5) * 0.0009;
  vec2 uvUI = uv + erode * px * 0.7 * gs + vec2(jitter, 0.0);
  vec2 d = px * gs * 1.4;
  float ui = texture(uUI, uvUI).r * 0.4
           + (texture(uUI, uvUI + vec2(d.x, 0)).r + texture(uUI, uvUI - vec2(d.x, 0)).r
           +  texture(uUI, uvUI + vec2(0, d.y)).r + texture(uUI, uvUI - vec2(0, d.y)).r) * 0.15;
  ui *= wearMask(frag, gs);
  ui *= 0.93 + 0.07 * noise(frag / (160.0 * gs));
  ui *= uShowUI;
  float bloom = texture(uBloom, uv).r * uShowUI;

  I = mix(I, 0.85 + g * 0.05, ui) + bloom * 0.08;

  float scan = 0.5 + 0.5 * cos(frag.y / (2.5 * gs) * 6.2832);
  I *= 1.0 - 0.03 * scan;
  vec2 vq = uv * (1.0 - uv.yx);
  I *= mix(1.0, pow(clamp(vq.x * vq.y * 16.0, 0.0, 1.0), 0.28), 0.3);

  o = vec4(ramp(I), 1.0);
}`;

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}
function texture(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (w) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}
function target(w, h) {
  const tex = texture(w, h);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h };
}
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255); }

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const blurProg = program(BLUR);
const finalProg = program(FINAL);

const uiCanvas = document.createElement('canvas');
const ui = uiCanvas.getContext('2d');
const uiTex = texture();
let bloomA, bloomB, W, H, dpr, layout;

function font(size, weight = 700) { return `${weight} ${Math.round(size)}px "Handjet", monospace`; }

// ---- decor layers ------------------------------------------------------------
function cropMarks(w, h, inset = 26, arm = 30, t = 3) {
  for (const [sx, sy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
    const x = sx ? w - inset : inset, y = sy ? h - inset : inset, dx = sx ? -1 : 1, dy = sy ? -1 : 1;
    ui.fillRect(Math.min(x, x + dx * arm), sy ? y - t : y, arm, t);
    ui.fillRect(sx ? x - t : x, Math.min(y, y + dy * arm), t, arm);
  }
}
function header(w) {
  ui.textBaseline = 'alphabetic';
  ui.font = font(40, 800); ui.fillText('NAME SURNAME', 64, 78);
  ui.font = font(19, 600); ui.fillText('DESIGN & DEVELOPMENT  /  ARCHIVE 2019 - 2026', 66, 104);
  ui.textAlign = 'right';
  ui.font = font(19, 600); ui.fillText('INDEX  15 ENTRIES  /  01 LOCKED', w - 64, 78);
  ui.textAlign = 'left';
}
function statusBar(w, h) {
  const y = h - 58;
  ui.fillRect(64, y, w - 128, 3);
  ui.font = font(19, 600); ui.textBaseline = 'top';
  ui.fillText('SYSTEM READY', 64, y + 12);
  // segmented progress, like a loading gauge
  for (let i = 0; i < 12; i++) if (i < 8) ui.fillRect(220 + i * 11, y + 14, 7, 14);
  ui.textAlign = 'center'; ui.fillText('USE ARROWS + ENTER  /  CLICK A CELL', w / 2, y + 12);
  ui.textAlign = 'right'; ui.fillText('V0.1  /  ' + new Date().toTimeString().slice(0, 8), w - 64, y + 12);
  ui.textAlign = 'left'; ui.textBaseline = 'alphabetic';
}
function rulers(w, h, cx, cy) {
  ui.font = font(14, 600); ui.textBaseline = 'top';
  ui.fillRect(60, 30, w - 120, 2);
  for (let x = 60; x <= w - 60; x += 10) {
    const big = (x - 60) % 100 === 0, mid = (x - 60) % 50 === 0;
    ui.fillRect(x, 32, 2, big ? 14 : mid ? 9 : 5);
    if (big) ui.fillText(String(x - 60).padStart(4, '0'), x + 4, 38);
  }
  ui.fillRect(30, 60, 2, h - 150);
  ui.textBaseline = 'middle';
  for (let y = 60; y <= h - 90; y += 10) {
    const big = (y - 60) % 100 === 0, mid = (y - 60) % 50 === 0;
    ui.fillRect(32, y, big ? 14 : mid ? 9 : 5, 2);
    if (big) { ui.save(); ui.translate(40, y + 4); ui.rotate(Math.PI / 2); ui.fillText(String(y - 60).padStart(4, '0'), 0, 0); ui.restore(); }
  }
  // markers that follow the crosshair
  ui.beginPath(); ui.moveTo(cx - 9, 8); ui.lineTo(cx + 9, 8); ui.lineTo(cx, 24); ui.closePath(); ui.fill();
  ui.beginPath(); ui.moveTo(8, cy - 9); ui.lineTo(8, cy + 9); ui.lineTo(24, cy); ui.closePath(); ui.fill();
}
function barcode(x, y, bw, bh, seed) {
  let s = seed, cx = x;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  while (cx < x + bw) { const t = 2 + Math.floor(rnd() * 3) * 2; ui.fillRect(cx, y, t, bh); cx += t + 2 + Math.floor(rnd() * 3) * 2; }
}
function stamp(x, y, text) {
  ui.save(); ui.translate(x, y); ui.rotate(-0.07);
  ui.font = font(44, 800);
  const tw = ui.measureText(text).width;
  ui.lineWidth = 5; ui.strokeStyle = ON;
  ui.strokeRect(-16, -46, tw + 32, 62);
  ui.strokeRect(-24, -54, tw + 48, 78);
  ui.textBaseline = 'alphabetic'; ui.fillText(text, 0, 4);
  ui.restore();
}

function drawDecor(w, h, cx, cy) {
  ui.fillStyle = ON;
  if (decor === 'minimal') { cropMarks(w, h); header(w); statusBar(w, h); }
  if (decor === 'technique') { rulers(w, h, cx, cy); statusBar(w, h); cropMarks(w, h, 26, 22, 3); }
  if (decor === 'dossier') {
    header(w); statusBar(w, h); cropMarks(w, h);
    stamp(w - 330, 210, 'ARCHIVE');
    barcode(w - 300, h - 150, 236, 46, 47);
    ui.font = font(17, 600); ui.fillText('ARCH-2026-0047', w - 300, h - 82);
    ui.font = font(17, 600); ui.fillText('FILE  Nº 0047', 66, h - 82);
    ui.fillText('CLEARANCE  PUBLIC', 66, h - 104);
  }
}

// ---- grid + crosshair ---------------------------------------------------------
function drawUI() {
  const w = innerWidth, h = innerHeight;
  uiCanvas.width = W; uiCanvas.height = H;
  ui.setTransform(dpr, 0, 0, dpr, 0, 0);
  ui.fillStyle = OFF; ui.fillRect(0, 0, w, h);

  const C = Math.min(w * P.cellOfWidth, h * P.cellOfHeight);
  const gap = C * P.gap, t = C * P.outline;
  const gw = C * 5 + gap * 4, gh = C * 3 + gap * 2;
  const x0 = (w - gw) / 2, y0 = (h - gh) / 2;
  const cellX = i => x0 + i * (C + gap), cellY = j => y0 + j * (C + gap);
  layout = { x0, y0, C, gap };

  const tx = cellX(TARGET.col), ty = cellY(TARGET.row);
  const cx = tx + C / 2, cy = ty + C / 2;
  drawDecor(w, h, cx, cy);

  function drawCell(name, x, y) {
    ui.globalAlpha = DIM.has(name) ? 0.38 : 1;
    ui.fillStyle = ON;
    ui.fillRect(x, y, C, t); ui.fillRect(x, y + C - t, C, t);
    ui.fillRect(x, y + t, t, C - 2 * t); ui.fillRect(x + C - t, y + t, t, C - 2 * t);
    const s = C * P.pictoBox / 100;
    ui.save();
    ui.translate(x + (C - 100 * s) / 2, y + (C - 100 * s) / 2); ui.scale(s, s);
    ui.lineJoin = 'miter'; ui.lineCap = 'butt';
    PICTOS[name](ui);
    ui.restore();
    ui.globalAlpha = 1;
  }
  GRID.forEach((name, k) => drawCell(name, cellX(k % 5), cellY(Math.floor(k / 5))));

  const L = C * P.line, K = C * P.knock;
  const bt = C * P.bracket, arm = C * P.bracketArm, off = C * P.bracketOffset;
  const bx = tx - off, by = ty - off, bs = C + off * 2;
  const brackets = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([sx, sy]) => {
    const px = bx + sx * bs, py = by + sy * bs, dx = sx ? -1 : 1, dy = sy ? -1 : 1;
    return [[Math.min(px, px + dx * arm), sy ? py - bt : py, arm, bt], [sx ? px - bt : px, Math.min(py, py + dy * arm), bt, arm]];
  }).flat();
  const lines = [
    [w * 0.027, cy - L / 2, tx - w * 0.027, L], [tx + C, cy - L / 2, w * 0.973 - tx - C, L],
    [cx - L / 2, h * 0.015, L, ty - h * 0.015], [cx - L / 2, ty + C, L, h * 0.985 - ty - C],
  ];
  ui.fillStyle = OFF;
  for (const [x, y, rw, rh] of [...lines, ...brackets]) ui.fillRect(x - K, y - K, rw + 2 * K, rh + 2 * K);
  ui.fillStyle = ON;
  for (const r of [...lines, ...brackets]) ui.fillRect(...r);
  ui.fillStyle = OFF; ui.fillRect(tx, ty, C, C);
  drawCell(GRID[TARGET.row * 5 + TARGET.col], tx, ty);

  ui.font = font(C * P.label);
  ui.textBaseline = 'alphabetic';
  const lx = bx + bs + C * 0.1, ly = cy - L / 2 - K - C * 0.08;
  const label = 'Archive index loaded. Awaiting selection ...';
  ui.lineJoin = 'round'; ui.lineWidth = K * 1.6; ui.strokeStyle = OFF; ui.strokeText(label, lx, ly);
  ui.fillStyle = ON; ui.fillText(label, lx, ly);
  if (decor === 'technique') {
    const coords = `X ${String(Math.round(cx)).padStart(4, '0')}   Y ${String(Math.round(cy)).padStart(4, '0')}`;
    ui.font = font(C * 0.11, 600); ui.textBaseline = 'top';
    const cyy = cy + L / 2 + K + C * 0.06;
    ui.strokeText(coords, lx, cyy); ui.fillText(coords, lx, cyy);
  }

  gl.bindTexture(gl.TEXTURE_2D, uiTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, uiCanvas);
}

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 1.5);
  W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
  canvas.width = W; canvas.height = H;
  bloomA = target(W >> 1, H >> 1);
  bloomB = target(W >> 1, H >> 1);
  drawUI();
}

function blur(src, dst, dx, dy) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
  gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(blurProg.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src);
  gl.uniform1i(blurProg.u.uTex, 0);
  gl.uniform2f(blurProg.u.uDir, dx / dst.w, dy / dst.h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function frame(now) {
  blur(uiTex, bloomA, 2, 0); blur(bloomA.tex, bloomB, 0, 2);
  blur(bloomB.tex, bloomA, 4, 0); blur(bloomA.tex, bloomB, 0, 4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(finalProg.p);
  const u = finalProg.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, uiTex); gl.uniform1i(u.uUI, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomB.tex); gl.uniform1i(u.uBloom, 1);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform1f(u.uTime, now / 1000);
  gl.uniform1f(u.uShowUI, showUI ? 1 : 0);
  gl.uniform1f(u.uBg, bg);
  // grid geometry in GL pixels: origin sits in the gutter above-left of the first cell
  const pitch = (layout.C + layout.gap) * dpr;
  gl.uniform1f(u.uPitch, pitch);
  gl.uniform2f(u.uOrigin, (layout.x0 - layout.gap / 2) * dpr, H - (layout.y0 - layout.gap / 2) * dpr);
  (inverted ? PALETTE_INV : PALETTE).forEach((c, i) => gl.uniform3fv(u[`uC${i}`], hex(c)));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  hud.style.display = showHud ? 'block' : 'none';
  hud.textContent = `${BACKGROUNDS[bg]} · ${inverted ? 'inverted' : 'normal'} · decor ${decor}\nB  background   I  invert   D  decor   U  UI   H  hide`;
  requestAnimationFrame(frame);
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'b') bg = (bg + 1) % BACKGROUNDS.length;
  if (k === 'i') inverted = !inverted;
  if (k === 'd') { decor = DECORS[(DECORS.indexOf(decor) + 1) % DECORS.length]; drawUI(); }
  if (k === 'u') showUI = !showUI;
  if (k === 'h') showHud = !showHud;
});
addEventListener('resize', resize);

Promise.all([document.fonts.load('700 40px "Handjet"'), document.fonts.load('12px "Share Tech Mono"')]).finally(() => {
  resize();
  requestAnimationFrame(frame);
  window.__ready = true;
});
</script>
</body>
</html>
